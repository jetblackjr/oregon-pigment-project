<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#30291f">

<title>Oregon Pigment Project</title>

<style>
:root{
  --ink:#29251f;
  --muted:#756d61;
  --paper:#f4efe5;
  --card:#fffdf8;
  --line:#d8cebd;
  --accent:#76542d;
  --accent2:#b9894a;
  --danger:#9a3d2f;
  --dark:#30291f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:
    linear-gradient(rgba(38,31,23,.60),rgba(38,31,23,.60)),
    url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1800&q=85")
    center/cover;
  color:white;
  padding:34px 18px 22px;
  box-shadow:0 2px 15px rgba(0,0,0,.18);
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:32px;
  letter-spacing:.2px;
}

header p{
  margin:6px 0 0;
  color:#e5dac9;
  font-size:13px;
  max-width:650px;
}

nav{
  display:flex;
  gap:8px;
  margin-top:20px;
  overflow:auto;
  padding-bottom:2px;
}

button,
.button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  font-weight:650;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  white-space:nowrap;
}

button:hover,
.button:hover{
  filter:brightness(1.08);
}

.secondary{
  background:#e8dfd0;
  color:var(--ink);
}

.danger{
  background:var(--danger);
}

main{
  max-width:1100px;
  margin:auto;
  padding:22px 16px 50px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.toolbar input{
  flex:1;
  min-width:220px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px;
  background:#fffdf9;
  color:var(--ink);
  font:inherit;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  outline:2px solid rgba(185,137,74,.25);
  border-color:var(--accent2);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(75,56,32,.05);
}

.card h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  font-weight:750;
  color:var(--muted);
  display:block;
  margin-bottom:5px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:8px;
}

.gallery img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:9px;
  border:1px solid var(--line);
}

.specimen{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:16px;
  align-items:start;
}

.thumb{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:10px;
  background:#e9e0d0;
}

.specimen h3{
  margin:0 0 5px;
  font-family:Georgia,serif;
  font-size:21px;
}

.meta{
  color:var(--muted);
  font-size:13px;
}

.tags{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:8px;
}

.tag{
  background:#eee5d7;
  border-radius:99px;
  padding:4px 8px;
  font-size:11px;
}

.notice{
  padding:12px;
  border-radius:9px;
  background:#efe5d2;
  font-size:13px;
  margin-bottom:14px;
}

.success{
  background:#e6eee3;
}

.error{
  background:#f3e1dd;
  color:#6e251d;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.right{
  margin-left:auto;
}

.hidden{
  display:none!important;
}

.photo-help{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.section-image{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:11px;
  margin-bottom:14px;
}

.small-note{
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
}

.db-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:#ded5c7;
}

.db-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#8eaa7b;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .specimen{
    grid-template-columns:90px 1fr;
  }

  .thumb{
    width:90px;
    height:90px;
  }

  h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <h1>Oregon Pigment Project</h1>

    <p>
      Documenting Oregon earth, color, process and place.
    </p>

    <div class="row" style="margin-top:8px">

      <span class="db-status">
        <span class="db-dot"></span>
        OPP catalog
      </span>

    </div>

    <nav>

      <button type="button" onclick="show('list')">
        Collection
      </button>

      <button type="button" onclick="show('form')">
        + New Specimen
      </button>

      <button type="button" class="secondary" onclick="backup()">
        Private Backup
      </button>

      <button type="button" class="secondary" onclick="exportPublic()">
        Export Public Catalog
      </button>

      <label class="button secondary" style="cursor:pointer">

        Import

        <input
          id="import"
          type="file"
          accept=".json"
          hidden
        >

      </label>

    </nav>

  </div>

</header>


<main>

<section id="listView">

  <div id="status" class="notice hidden"></div>

  <div class="toolbar">

    <input
      id="search"
      placeholder="Search ID, material, place, color, tags…"
    >

    <select id="filter">

      <option value="">
        All specimens
      </option>

      <option>
        Raw material
      </option>

      <option>
        Processed pigment
      </option>

      <option>
        Finished sample
      </option>

    </select>

    <select id="visibility">

      <option value="all">
        My collection
      </option>

      <option value="public">
        Public catalog
      </option>

      <option value="shared">
        Shared with public
      </option>

    </select>

  </div>

  <div id="list"></div>

</section>



<section id="formView" class="hidden">

  <div class="card">

    <div class="row">

      <h2
        id="formTitle"
        style="font-family:Georgia,serif"
      >
        New specimen
      </h2>

      <span
        class="right meta"
        id="specimenId"
      ></span>

    </div>


    <div class="notice">

      You do not need to complete every field.

      Record what you know now and return to this specimen
      later as testing continues.

    </div>


    <div class="grid">

      <div>

        <label>Catalog stage</label>

        <select id="stage">

          <option>
            Raw material
          </option>

          <option>
            Processed pigment
          </option>

          <option>
            Finished sample
          </option>

        </select>

      </div>


      <div>

        <label>Collection date</label>

        <input id="date" type="date">

      </div>


      <div>

        <label>Collector</label>

        <input
          id="collector"
          placeholder="Name / initials"
        >

      </div>


      <div>

        <label>Source / provenance</label>

        <input
          id="source"
          placeholder="Natural outcrop, stream deposit, purchased, etc."
        >

      </div>


      <div class="full">

        <label>
          Specimen name / working name
        </label>

        <input
          id="name"
          placeholder="e.g. Red Earth — Central Oregon"
        >

      </div>


      <div>

        <label>
          Material / suspected mineral
        </label>

        <input
          id="material"
          placeholder="Record as a working observation"
        >

      </div>


      <div>

        <label>
          Geologic setting
        </label>

        <input
          id="geology"
          placeholder="Basalt flow, river deposit, weathered zone…"
        >

      </div>


      <div>

        <label>
          County / locality
        </label>

        <input id="locality">

      </div>


      <div>

        <label>
          GPS latitude
        </label>

        <input
          id="lat"
          inputmode="decimal"
        >

      </div>


      <div>

        <label>
          GPS longitude
        </label>

        <input
          id="lon"
          inputmode="decimal"
        >

      </div>


      <div class="full">

        <button
          type="button"
          onclick="locate()"
        >
          Capture current GPS location
        </button>

        <span
          id="locStatus"
          class="meta"
        ></span>

      </div>


      <div>

        <label>
          Color — field observation
        </label>

        <input
          id="color"
          placeholder="red-brown, yellow ochre…"
        >

      </div>


      <div>

        <label>
          Color code / Munsell / HEX
        </label>

        <input id="colorCode">

      </div>


      <div>

        <label>
          Texture / grain
        </label>

        <input id="texture">

      </div>


      <div>

        <label>
          Luster
        </label>

        <select id="luster">

          <option></option>
          <option>Earthy</option>
          <option>Dull</option>
          <option>Glassy</option>
          <option>Metallic</option>
          <option>Pearly</option>
          <option>Other</option>

        </select>

      </div>


      <div>

        <label>
          Hardness
        </label>

        <input
          id="hardness"
          placeholder="Mohs / scratch observations"
        >

      </div>


      <div>

        <label>
          Streak
        </label>

        <input id="streak">

      </div>


      <div>

        <label>
          Magnetic response
        </label>

        <select id="magnetic">

          <option></option>
          <option>No</option>
          <option>Weak</option>
          <option>Strong</option>

        </select>

      </div>


      <div>

        <label>
          Acid / vinegar reaction
        </label>

        <input id="reaction">

      </div>


      <div>

        <label>
          Moisture / condition
        </label>

        <input
          id="condition"
          placeholder="Dry, damp
