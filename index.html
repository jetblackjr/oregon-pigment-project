<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#30291f">
<title>Oregon Pigment Project</title>
<link rel="manifest" href="manifest.json">

<style>
:root{
  --ink:#29251f;
  --muted:#756d61;
  --paper:#f4efe5;
  --card:#fffdf8;
  --line:#d8cebd;
  --accent:#76542d;
  --accent2:#b9894a;
  --danger:#9a3d2f;
  --dark:#30291f;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:
    linear-gradient(rgba(38,31,23,.72),rgba(38,31,23,.72)),
    url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1800&q=80")
    center/cover;
  color:white;
  padding:28px 18px 20px;
  position:sticky;
  top:0;
  z-index:5;
  box-shadow:0 2px 15px rgba(0,0,0,.18);
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:30px;
  letter-spacing:.2px;
}

header p{
  margin:6px 0 0;
  color:#e5dac9;
  font-size:13px;
  max-width:650px;
}

nav{
  display:flex;
  gap:8px;
  margin-top:18px;
  overflow:auto;
  padding-bottom:2px;
}

button,.button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  font-weight:650;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  white-space:nowrap;
}

button:hover,.button:hover{
  filter:brightness(1.08);
}

button:disabled{
  opacity:.6;
  cursor:default;
  filter:none;
}

.secondary{
  background:#e8dfd0;
  color:var(--ink);
}

.danger{
  background:var(--danger);
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 50px;
}

.hero{
  min-height:250px;
  border-radius:16px;
  margin-bottom:18px;
  background:
    linear-gradient(90deg,rgba(39,32,24,.82),rgba(39,32,24,.28)),
    url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1800&q=85")
    center/cover;
  display:flex;
  align-items:flex-end;
  padding:28px;
  color:white;
}

.hero h2{
  font-family:Georgia,serif;
  font-size:32px;
  margin:0 0 7px;
}

.hero p{
  max-width:650px;
  margin:0;
  color:#eee5d8;
  line-height:1.55;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.toolbar input{
  flex:1;
  min-width:220px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px;
  background:#fffdf9;
  color:var(--ink);
  font:inherit;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,select:focus,textarea:focus{
  outline:2px solid rgba(185,137,74,.25);
  border-color:var(--accent2);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(75,56,32,.05);
}

.card h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  font-weight:750;
  color:var(--muted);
  display:block;
  margin-bottom:5px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:8px;
}

.gallery img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:9px;
  border:1px solid var(--line);
}

.specimen{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:16px;
  align-items:start;
}

.thumb{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:10px;
  background:#e9e0d0;
}

.specimen h3{
  margin:0 0 5px;
  font-family:Georgia,serif;
  font-size:21px;
}

.meta{
  color:var(--muted);
  font-size:13px;
}

.tags{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:8px;
}

.tag{
  background:#eee5d7;
  border-radius:99px;
  padding:4px 8px;
  font-size:11px;
}

.notice{
  padding:12px;
  border-radius:9px;
  background:#efe5d2;
  font-size:13px;
  margin-bottom:14px;
}

.success{
  background:#e6eee3;
}

.error{
  background:#f3e1dd;
  color:#6e251d;
}

.status{
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.right{
  margin-left:auto;
}

.hidden{
  display:none!important;
}

.photo-help{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.section-image{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:11px;
  margin-bottom:14px;
}

.small-note{
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
}

.db-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:#ded5c7;
}

.db-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#8eaa7b;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }

  .specimen{
    grid-template-columns:90px 1fr;
  }

  .thumb{
    width:90px;
    height:90px;
  }

  .hero{
    min-height:220px;
    padding:20px;
  }

  .hero h2{
    font-size:26px;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>Oregon Pigment Project</h1>
    <p>Documenting Oregon earth, color, process and place.</p>
